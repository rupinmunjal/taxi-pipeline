[project]
name = "taxi-pipeline"
version = "0.1.0"
description = "Local PySpark pipeline for loading partitioned NYC taxi data into BigQuery"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-cloud-bigquery>=3.44.0",
    "google-cloud-storage>=3.13.1",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pyspark>=4.2.0",
    "python-dotenv>=1.0.1",
    "streamlit>=1.62.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
